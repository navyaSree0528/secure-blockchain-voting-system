<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Secure Voting System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#071739,#0d2f66,#174ea6);
            overflow:hidden;
            position:relative;
        }

        .circle{
            position:absolute;
            border-radius:50%;
            filter:blur(90px);
            opacity:0.35;
        }

        .circle1{
            width:320px;
            height:320px;
            background:#00c6ff;
            top:-100px;
            left:-80px;
        }

        .circle2{
            width:280px;
            height:280px;
            background:#7b61ff;
            bottom:-80px;
            right:-60px;
        }

        .register-card{
            width:440px;
            padding:42px;
            border-radius:28px;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.15);
            backdrop-filter:blur(18px);
            box-shadow:0 20px 50px rgba(0,0,0,0.35);
            color:white;
            z-index:2;
        }

        .logo{
            width:82px;
            height:82px;
            border-radius:50%;
            margin:0 auto 20px;
            background:linear-gradient(135deg,#00c6ff,#3366ff);
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:34px;
            color:white;
        }

        h2{
            text-align:center;
            font-weight:700;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#d8e4ff;
            margin-bottom:32px;
            font-size:15px;
        }

        .form-label{
            color:#eef4ff;
            margin-bottom:8px;
            font-weight:500;
        }

        .form-control{
            background:rgba(255,255,255,0.08);
            border:none;
            border-radius:14px;
            padding:14px 16px;
            color:white;
        }

        .form-control::placeholder{
            color:#bfd0f5;
        }

        .form-control:focus{
            background:rgba(255,255,255,0.12);
            color:white;
            border:1px solid #58bfff;
            box-shadow:none;
        }

        .btn-register{
            width:100%;
            padding:14px;
            border:none;
            border-radius:14px;
            background:linear-gradient(135deg,#00c6ff,#3366ff);
            color:white;
            font-weight:600;
            transition:0.3s;
            margin-top:8px;
        }

        .btn-register:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 20px rgba(0,198,255,0.35);
        }

        .footer-text{
            text-align:center;
            margin-top:24px;
            color:#d0dcff;
            font-size:14px;
        }

        .footer-text a{
            color:#67d5ff;
            text-decoration:none;
            font-weight:600;
        }

        .footer-text a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <div class="register-card">
        <div class="logo">
            <i class="fa-solid fa-user-plus"></i>
        </div>

        <h2>Voter Registration</h2>
        <p class="subtitle">
            Enter your voter ID to verify your eligibility and receive OTP
        </p>

        <form method="POST" action="/send_register_otp">
            <div class="mb-4">
                <label class="form-label">Voter ID</label>
                <input type="text"
                       name="voter_id"
                       class="form-control"
                       placeholder="Example: VOTER001"
                       required>
            </div>

            <button type="submit" class="btn-register">
                <i class="fa-solid fa-paper-plane me-2"></i>
                Send OTP
            </button>
        </form>

        <div class="footer-text">
            Already have an account?
            <a href="/">Back to Login</a>
        </div>
    </div>

</body>
</html>
