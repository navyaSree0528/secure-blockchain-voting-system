<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Voting Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#071739,#0d2f66,#174ea6);
            overflow-y:auto;
            overflow-x:hidden;
            position:relative;
            padding:30px 0;
        }

        .circle{
            position:absolute;
            border-radius:50%;
            filter:blur(80px);
            opacity:0.35;
        }

        .circle1{
            width:320px;
            height:320px;
            background:#00c6ff;
            top:-90px;
            left:-90px;
        }

        .circle2{
            width:280px;
            height:280px;
            background:#7b61ff;
            bottom:-90px;
            right:-90px;
        }

       .login-card{
            width:430px;
            padding:42px;
            border-radius:30px;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.14);
            backdrop-filter:blur(18px);
            box-shadow:0 24px 55px rgba(0,0,0,0.38);
            color:white;
            z-index:2;
            margin:20px 0;
        }

        .logo{
            width:84px;
            height:84px;
            border-radius:50%;
            margin:0 auto 22px;
            background:linear-gradient(135deg,#00c6ff,#4f7cff);
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:36px;
            color:white;
            box-shadow:0 12px 28px rgba(0,198,255,0.35);
        }

        h2{
            text-align:center;
            font-weight:700;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#d8e4ff;
            margin-bottom:28px;
            font-size:15px;
            line-height:1.6;
        }

        .alert-custom{
            border-radius:16px;
            background:rgba(255,77,109,0.16);
            color:#ffd6dc;
            border:1px solid rgba(255,77,109,0.35);
            padding:14px;
            text-align:center;
            margin-bottom:22px;
            font-size:14px;
        }

        .form-label{
            margin-bottom:8px;
            color:#eef4ff;
            font-weight:600;
        }

        .input-group-custom{
            position:relative;
            margin-bottom:20px;
        }

        .input-group-custom i{
            position:absolute;
            top:50%;
            left:16px;
            transform:translateY(-50%);
            color:#9ec4ff;
            font-size:15px;
            z-index:2;
        }

        .form-control{
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.12);
            border-radius:16px;
            padding:14px 16px 14px 46px;
            color:white;
            font-size:15px;
        }

        .form-control::placeholder{
            color:#c4d4f7;
        }

        .form-control:focus{
            background:rgba(255,255,255,0.12);
            color:white;
            border:1px solid #58bfff;
            box-shadow:0 0 0 4px rgba(88,191,255,0.12);
        }

        .btn-login{
            width:100%;
            padding:14px;
            border:none;
            border-radius:16px;
            background:linear-gradient(135deg,#00c6ff,#3366ff);
            color:white;
            font-weight:700;
            font-size:15px;
            margin-top:6px;
            transition:0.3s;
        }

        .btn-login:hover{
            transform:translateY(-2px);
            box-shadow:0 14px 28px rgba(0,198,255,0.35);
        }

        .divider{
            text-align:center;
            color:#bfd0f5;
            margin:24px 0 18px;
            position:relative;
            font-size:14px;
        }

        .divider::before,
        .divider::after{
            content:"";
            position:absolute;
            top:50%;
            width:38%;
            height:1px;
            background:rgba(255,255,255,0.15);
        }

        .divider::before{
            left:0;
        }

        .divider::after{
            right:0;
        }

        .secondary-btn{
            width:100%;
            border-radius:16px;
            padding:13px;
            font-weight:600;
            margin-bottom:12px;
            transition:0.25s;
        }

        .secondary-btn:hover{
            transform:translateY(-2px);
        }

        .register-btn{
            border:1px solid rgba(255,255,255,0.25);
            color:white;
            background:rgba(255,255,255,0.05);
        }

        .register-btn:hover{
            background:rgba(255,255,255,0.12);
            color:white;
        }

        .admin-btn{
            background:rgba(0,0,0,0.25);
            color:white;
            border:1px solid rgba(255,255,255,0.15);
        }

        .admin-btn:hover{
            background:rgba(0,0,0,0.4);
            color:white;
        }

        @media(max-width:500px){
            .login-card{
                width:92%;
                padding:32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <div class="login-card">

        <div class="logo">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h2>Secure Voting Login</h2>

        <p class="subtitle">
            Access your blockchain-based voting account securely and cast your vote safely.
        </p>

        {% if error %}
        <div class="alert-custom">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">

            <label class="form-label">Voter ID</label>
            <div class="input-group-custom">
                <i class="fa-solid fa-id-card"></i>
                <input
                    type="text"
                    name="voter_id"
                    class="form-control"
                    placeholder="Enter your voter ID"
                    required
                >
            </div>

            <label class="form-label">Password</label>
            <div class="input-group-custom">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                <i class="fa-solid fa-right-to-bracket me-2"></i>
                Login
            </button>

        </form>

        <div class="divider">OR</div>

        <a href="/register" class="btn secondary-btn register-btn">
            <i class="fa-solid fa-user-plus me-2"></i>
            Register as Voter
        </a>

        <a href="/admin" class="btn secondary-btn admin-btn">
            <i class="fa-solid fa-user-shield me-2"></i>
            Admin Login
        </a>

    </div>

</body>
</html>
