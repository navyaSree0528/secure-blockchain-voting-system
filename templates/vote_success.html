<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Submitted Successfully</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            background:
                radial-gradient(circle at top left,#2a6cff22,transparent 25%),
                radial-gradient(circle at bottom right,#00c89622,transparent 25%),
                linear-gradient(135deg,#eef3fb,#dfe9f8);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:24px;
        }

        .success-card{
            width:100%;
            max-width:680px;
            background:white;
            border-radius:32px;
            padding:42px;
            text-align:center;
            box-shadow:0 20px 45px rgba(0,0,0,0.08);
            position:relative;
            overflow:hidden;
        }

        .success-card::before{
            content:'';
            position:absolute;
            top:-80px;
            right:-80px;
            width:220px;
            height:220px;
            background:rgba(42,108,255,0.08);
            border-radius:50%;
        }

        .success-icon{
            width:92px;
            height:92px;
            margin:0 auto 24px;
            border-radius:50%;
            background:linear-gradient(135deg,#00c896,#1ca36d);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            box-shadow:0 14px 30px rgba(28,163,109,0.28);
        }

        h1{
            font-size:2.2rem;
            font-weight:700;
            color:#16345f;
            margin-bottom:12px;
        }

        .subtitle{
            color:#667085;
            font-size:16px;
            margin-bottom:30px;
        }

        .verification-label{
            font-size:15px;
            font-weight:600;
            color:#4b5563;
            margin-bottom:12px;
        }

        .verification-box{
            background:#f4f7fc;
            border:2px dashed #bfd2ff;
            border-radius:20px;
            padding:22px;
            margin-bottom:18px;
            word-break:break-all;
            font-size:15px;
            font-weight:600;
            color:#16345f;
            line-height:1.8;
        }

        .copy-btn{
            border:none;
            background:#edf3ff;
            color:#2a6cff;
            border-radius:12px;
            padding:10px 18px;
            font-weight:600;
            margin-bottom:24px;
            transition:0.25s;
        }

        .copy-btn:hover{
            background:#dce8ff;
        }

        .note{
            background:#fff7e8;
            border-left:5px solid #ffb020;
            border-radius:14px;
            padding:16px;
            text-align:left;
            color:#7a5a12;
            font-size:14px;
            margin-bottom:30px;
        }

        .button-group{
            display:flex;
            gap:14px;
            justify-content:center;
            flex-wrap:wrap;
        }

        .btn-custom{
            padding:14px 26px;
            border-radius:16px;
            font-weight:600;
            min-width:200px;
        }

        .btn-verify{
            background:#1ca36d;
            color:white;
            border:none;
        }

        .btn-verify:hover{
            background:#15875a;
            color:white;
        }

        .btn-dashboard{
            background:#2a6cff;
            color:white;
            border:none;
        }

        .btn-dashboard:hover{
            background:#1658e5;
            color:white;
        }

        @media(max-width:576px){
            .success-card{
                padding:32px 22px;
            }

            h1{
                font-size:1.8rem;
            }

            .btn-custom{
                width:100%;
            }
        }
    </style>
</head>
<body>

    <div class="success-card">

        <div class="success-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h1>Vote Submitted Successfully</h1>

        <p class="subtitle">
            Your vote has been encrypted and securely recorded in the system.
        </p>

        <div class="verification-label">
            Your Verification ID
        </div>

        <div class="verification-box" id="voteHash">
            {{ vote_hash }}
        </div>

        <button class="copy-btn" onclick="copyVoteHash()">
            <i class="fa-solid fa-copy me-2"></i>
            Copy Verification ID
        </button>

        <div class="note">
            <strong>Important:</strong> Save this verification ID carefully. You will need it later to verify that your vote was successfully recorded.
        </div>

        <div class="button-group">
            <a href="/verify_vote" class="btn btn-custom btn-verify">
                <i class="fa-solid fa-shield-check me-2"></i>
                Verify Vote
            </a>

            <a href="/dashboard" class="btn btn-custom btn-dashboard">
                <i class="fa-solid fa-house me-2"></i>
                Back to Dashboard
            </a>
        </div>
    </div>

    <script>
        function copyVoteHash() {
            const text = document.getElementById("voteHash").innerText;

            navigator.clipboard.writeText(text);

            const btn = document.querySelector(".copy-btn");
            btn.innerHTML = '<i class="fa-solid fa-check me-2"></i>Copied!';
            
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-copy me-2"></i>Copy Verification ID';
            }, 2000);
        }
    </script>

</body>
</html>
