<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Vote</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:24px;
            background:
                radial-gradient(circle at top left,#2a6cff22,transparent 25%),
                radial-gradient(circle at bottom right,#00c89622,transparent 25%),
                linear-gradient(135deg,#eef3fb,#dfe9f8);
        }

        .verify-card{
            width:100%;
            max-width:560px;
            background:white;
            border-radius:30px;
            padding:42px;
            box-shadow:0 20px 45px rgba(0,0,0,0.08);
            text-align:center;
            position:relative;
            overflow:hidden;
        }

        .verify-card::before{
            content:'';
            position:absolute;
            width:180px;
            height:180px;
            border-radius:50%;
            background:rgba(42,108,255,0.08);
            top:-70px;
            right:-60px;
        }

        .icon-box{
            width:86px;
            height:86px;
            border-radius:50%;
            margin:0 auto 22px;
            background:linear-gradient(135deg,#2a6cff,#5d8dff);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:34px;
            box-shadow:0 12px 28px rgba(42,108,255,0.25);
        }

        h1{
            font-size:2rem;
            font-weight:700;
            color:#16345f;
            margin-bottom:12px;
        }

        .subtitle{
            color:#667085;
            font-size:15px;
            line-height:1.7;
            margin-bottom:30px;
        }

        .input-label{
            text-align:left;
            display:block;
            margin-bottom:10px;
            font-weight:600;
            color:#344054;
        }

        .input-group-custom{
            position:relative;
            margin-bottom:18px;
        }

        .input-group-custom i{
            position:absolute;
            left:18px;
            top:50%;
            transform:translateY(-50%);
            color:#7b8cb2;
            font-size:15px;
        }

        .form-control{
            border:2px solid #dde6f4;
            border-radius:18px;
            padding:16px 18px 16px 50px;
            font-size:15px;
            color:#16345f;
            background:#fafcff;
        }

        .form-control:focus{
            border-color:#2a6cff;
            box-shadow:none;
            background:white;
        }

        .help-text{
            background:#f5f8ff;
            border-left:4px solid #2a6cff;
            border-radius:12px;
            padding:14px 16px;
            text-align:left;
            color:#667085;
            font-size:14px;
            margin-bottom:28px;
        }

        .verify-btn{
            width:100%;
            border:none;
            border-radius:18px;
            padding:15px;
            background:linear-gradient(135deg,#2a6cff,#1658e5);
            color:white;
            font-size:16px;
            font-weight:700;
            transition:0.25s;
        }

        .verify-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 12px 24px rgba(42,108,255,0.25);
        }

        .back-link{
            display:inline-block;
            margin-top:22px;
            color:#2a6cff;
            text-decoration:none;
            font-weight:600;
        }

        .back-link:hover{
            color:#1658e5;
        }

        @media(max-width:576px){
            .verify-card{
                padding:32px 22px;
            }

            h1{
                font-size:1.7rem;
            }
        }
    </style>
</head>
<body>

    <div class="verify-card">

        <div class="icon-box">
            <i class="fa-solid fa-shield-check"></i>
        </div>

        <h1>Verify Your Vote</h1>

        <p class="subtitle">
            Enter the verification ID you received after voting to confirm that your vote has been securely recorded.
        </p>

        <form method="POST">

            <label class="input-label">Verification ID</label>

            <div class="input-group-custom">
                <i class="fa-solid fa-key"></i>

                <input
                    type="text"
                    name="vote_hash"
                    class="form-control"
                    placeholder="Paste your verification ID here"
                    required>
            </div>

            <div class="help-text">
                <strong>Tip:</strong> Your verification ID was shown immediately after you submitted your vote.
            </div>

            <button type="submit" class="verify-btn">
                <i class="fa-solid fa-magnifying-glass me-2"></i>
                Verify Vote
            </button>

        </form>

        <a href="/dashboard" class="back-link">
            <i class="fa-solid fa-arrow-left me-1"></i>
            Back to Dashboard
        </a>

    </div>

</body>
</html>
