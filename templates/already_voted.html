<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Already Voted</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:24px;
            background:
                radial-gradient(circle at top left,#ffb34722,transparent 25%),
                radial-gradient(circle at bottom right,#2a6cff22,transparent 25%),
                linear-gradient(135deg,#eef3fb,#dfe9f8);
        }

        .card-box{
            width:100%;
            max-width:560px;
            background:white;
            border-radius:32px;
            padding:42px 36px;
            text-align:center;
            box-shadow:0 20px 45px rgba(0,0,0,0.08);
            position:relative;
            overflow:hidden;
        }

        .card-box::before{
            content:'';
            position:absolute;
            width:220px;
            height:220px;
            border-radius:50%;
            background:rgba(255,179,71,0.08);
            top:-80px;
            right:-80px;
        }

        .icon-circle{
            width:92px;
            height:92px;
            margin:0 auto 24px;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ffb020,#ff7a18);
            color:white;
            font-size:40px;
            box-shadow:0 14px 30px rgba(255,176,32,0.28);
        }

        h1{
            font-size:2rem;
            font-weight:700;
            color:#9a5b00;
            margin-bottom:14px;
        }

        .subtitle{
            color:#667085;
            font-size:15px;
            line-height:1.8;
            margin-bottom:28px;
        }

        .info-box{
            background:#fff8eb;
            border:1px solid #ffd99c;
            border-radius:18px;
            padding:18px;
            color:#9a5b00;
            font-size:15px;
            font-weight:600;
            margin-bottom:30px;
        }

        .btn-group-custom{
            display:flex;
            gap:14px;
            justify-content:center;
            flex-wrap:wrap;
        }

        .btn-custom{
            border:none;
            border-radius:16px;
            padding:14px 22px;
            min-width:200px;
            font-weight:700;
            text-decoration:none;
            transition:0.25s;
        }

        .btn-verify{
            background:#2a6cff;
            color:white;
        }

        .btn-verify:hover{
            background:#1658e5;
            color:white;
            transform:translateY(-2px);
        }

        .btn-dashboard{
            background:#eef3ff;
            color:#2a6cff;
        }

        .btn-dashboard:hover{
            background:#dfe9ff;
            color:#1658e5;
            transform:translateY(-2px);
        }

        @media(max-width:576px){
            .card-box{
                padding:32px 22px;
            }

            h1{
                font-size:1.7rem;
            }

            .btn-custom{
                width:100%;
                min-width:auto;
            }
        }
    </style>
</head>
<body>

    <div class="card-box">

        <div class="icon-circle">
            <i class="fa-solid fa-ban"></i>
        </div>

        <h1>Vote Already Submitted</h1>

        <p class="subtitle">
            Our records show that you have already cast your vote. Each voter is allowed to vote only once.
        </p>

        <div class="info-box">
            <i class="fa-solid fa-circle-info me-2"></i>
            If you want to confirm your vote, use your verification ID in the Verify Vote section.
        </div>

        <div class="btn-group-custom">
            <a href="/verify_vote" class="btn-custom btn-verify">
                <i class="fa-solid fa-shield-check me-2"></i>
                Verify My Vote
            </a>

            <a href="/dashboard" class="btn-custom btn-dashboard">
                <i class="fa-solid fa-house me-2"></i>
                Back to Dashboard
            </a>
        </div>

    </div>

</body>
</html>
