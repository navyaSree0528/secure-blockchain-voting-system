
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                radial-gradient(circle at top left,#18c8ff33,transparent 30%),
                radial-gradient(circle at bottom right,#6d5dfc44,transparent 30%),
                linear-gradient(135deg,#06152d,#0b2d63,#123f8c);
            padding:20px;
        }

        .password-card{
            width:100%;
            max-width:460px;
            background:rgba(18,34,70,0.88);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:28px;
            padding:40px 34px;
            color:white;
            box-shadow:0 20px 50px rgba(0,0,0,0.35);
            backdrop-filter:blur(16px);
        }

        .icon-circle{
            width:80px;
            height:80px;
            margin:0 auto 24px;
            border-radius:50%;
            background:linear-gradient(135deg,#18c8ff,#3875ff);
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:30px;
            box-shadow:0 12px 25px rgba(24,200,255,0.35);
        }

        h1{
            text-align:center;
            font-size:2.3rem;
            font-weight:700;
            margin-bottom:12px;
        }

        .subtitle{
            text-align:center;
            color:#c7d4f3;
            line-height:1.7;
            font-size:15px;
            margin-bottom:30px;
        }

        .form-label{
            font-size:15px;
            font-weight:600;
            margin-bottom:10px;
            color:#eef4ff;
        }

        .input-box{
            position:relative;
            margin-bottom:14px;
        }

        .input-box i{
            position:absolute;
            left:18px;
            top:50%;
            transform:translateY(-50%);
            color:#8cb3ff;
            font-size:15px;
        }

        .form-control{
            width:100%;
            background:rgba(255,255,255,0.07);
            border:2px solid transparent;
            border-radius:16px;
            padding:16px 16px 16px 48px;
            color:white;
            font-size:15px;
            transition:0.3s;
        }

        .form-control::placeholder{
            color:#9bb0d8;
        }

        .form-control:focus{
            background:rgba(255,255,255,0.1);
            border-color:#2bbcff;
            box-shadow:none;
            color:white;
        }

        .form-control.is-invalid{
            border-color:#ff5d73;
        }

        .error-text{
            color:#ff8797;
            font-size:13px;
            margin-top:8px;
            display:none;
        }

        .tips{
            background:rgba(255,255,255,0.05);
            border-radius:16px;
            padding:18px;
            margin:22px 0 28px;
        }

        .tips h6{
            margin-bottom:12px;
            font-weight:600;
            color:#eef4ff;
        }

        .tips ul{
            margin:0;
            padding-left:18px;
            color:#c2d0ef;
            font-size:14px;
        }

        .tips li{
            margin-bottom:8px;
        }

        .rule.valid{
            color:#59e38d;
        }

        .btn-create{
            width:100%;
            border:none;
            border-radius:16px;
            padding:16px;
            font-size:16px;
            font-weight:600;
            color:white;
            background:linear-gradient(135deg,#18c8ff,#3875ff);
            transition:0.3s;
        }

        .btn-create:hover{
            transform:translateY(-2px);
            box-shadow:0 12px 25px rgba(24,200,255,0.35);
        }
    </style>
</head>
<body>

    <div class="password-card">

        <div class="icon-circle">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h1>Create Password</h1>

        <p class="subtitle">
            Your voter ID has been verified successfully. Create a secure password to activate your account.
        </p>

        <form method="POST" action="/set_password" id="passwordForm">
            <input type="hidden" name="voter_id" value="{{ voter_id }}">

            <label class="form-label">New Password</label>

            <div class="input-box">
                <i class="fa-solid fa-key"></i>
                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your secure password"
                    minlength="8"
                    required
                >
            </div>

            <div id="passwordError" class="error-text">
                Password must be at least 8 characters long.
            </div>

            <div class="tips">
                <h6>Password Rules</h6>
                <ul>
                    <li id="rule1" class="rule">At least 8 characters</li>
                    <li id="rule2" class="rule">Contains uppercase and lowercase letters</li>
                    <li id="rule3" class="rule">Contains a number or special symbol</li>
                </ul>
            </div>

            <button type="submit" class="btn-create">
                <i class="fa-solid fa-user-check me-2"></i>
                Create Account
            </button>
        </form>

    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const passwordForm = document.getElementById('passwordForm');
        const errorText = document.getElementById('passwordError');

        const rule1 = document.getElementById('rule1');
        const rule2 = document.getElementById('rule2');
        const rule3 = document.getElementById('rule3');

        passwordInput.addEventListener('input', function () {
            const value = passwordInput.value;

            // Rule 1: length >= 8
            if (value.length >= 8) {
                rule1.classList.add('valid');
            } else {
                rule1.classList.remove('valid');
            }

            // Rule 2: upper + lower
            if (/[A-Z]/.test(value) && /[a-z]/.test(value)) {
                rule2.classList.add('valid');
            } else {
                rule2.classList.remove('valid');
            }

            // Rule 3: number or symbol
            if (/[0-9]/.test(value) || /[^A-Za-z0-9]/.test(value)) {
                rule3.classList.add('valid');
            } else {
                rule3.classList.remove('valid');
            }
        });

        passwordForm.addEventListener('submit', function (e) {
            const value = passwordInput.value;

            const validLength = value.length >= 8;
            const validCase = /[A-Z]/.test(value) && /[a-z]/.test(value);
            const validNumber = /[0-9]/.test(value) || /[^A-Za-z0-9]/.test(value);

            if (!validLength || !validCase || !validNumber) {
                e.preventDefault();

                passwordInput.classList.add('is-invalid');
                errorText.style.display = 'block';

                if (!validLength) {
                    errorText.innerText = 'Password must be at least 8 characters long.';
                } else if (!validCase) {
                    errorText.innerText = 'Password must contain both uppercase and lowercase letters.';
                } else {
                    errorText.innerText = 'Password must contain at least one number or special symbol.';
                }
            } else {
                passwordInput.classList.remove('is-invalid');
                errorText.style.display = 'none';
            }
        });
    </script>

</body>
</html>
```
